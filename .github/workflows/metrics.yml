name: Generate activity metrics

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-metrics
  cancel-in-progress: true

jobs:
  activity-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate terminal activity calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: netteyr14
          template: terminal
          filename: metrics-isocalendar.svg
          base: ""
          config_timezone: Asia/Manila
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: none
          optimize: css, xml
          extras_css: |
            svg {
              color: #8b949e;
            }
            .header {
              background: #161b22;
              border: 1px solid #30363d;
              border-bottom: 0;
            }
            .title::before {
              content: "netteyr14@github — activity";
              color: #58a6ff;
            }
            pre {
              color: #c9d1d9;
              background: #0d1117;
              border: 1px solid #30363d;
            }
            .banner,
            footer {
              color: #8b949e;
            }
            .ps1-path,
            .ps1-location,
            .diff {
              color: #58a6ff;
            }
            .isocalendar svg {
              filter: none !important;
              opacity: 1;
            }
            .isocalendar path[fill="#ebedf0"] {
              fill: #161b22;
            }
            .isocalendar path[fill="#9be9a8"] {
              fill: #0d419d;
            }
            .isocalendar path[fill="#40c463"] {
              fill: #1f6feb;
            }
            .isocalendar path[fill="#30a14e"] {
              fill: #58a6ff;
            }
            .isocalendar path[fill="#216e39"] {
              fill: #79c0ff;
            }

      - name: Publish activity calendar
        shell: bash
        run: |
          cp /metrics_renders/metrics-isocalendar.svg metrics-isocalendar.svg
          perl -0pi -e 's|<!-- metrics:start -->.*?<!-- metrics:end -->|<!-- metrics:start -->\n<a href="https://github.com/netteyr14">\n  <img src="./metrics-isocalendar.svg" alt="Full-year GitHub contribution activity for netteyr14 in an isometric terminal calendar" width="100%">\n</a>\n<!-- metrics:end -->|s' README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md metrics-isocalendar.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update activity metrics [skip ci]"
          git push
